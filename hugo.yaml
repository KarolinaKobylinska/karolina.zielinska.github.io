    Title: "Karolina Zielińska"
    Content: |
      **Writing Samples**

      Welcome!

      On this page, You, Kind Reader, can find couple of my short stories. I chose texts that were written recently, so it would be easier to capture my current style.
      They’re written in Polish, as it is the native language of my and my readers (the tortured family and friends) - but if You require it, I can translate them to English.
      These samples are in a form of first draft, as I was not planing on publishing them anywhere, so I hope You will forgive eventual typos and small mistakes.

      > **Context/disclaimer:**
      >
      > First two of presented stories were created after the end of D&D campaign I ran, because I couldn’t let go of some of my favourite NPCs. The last one is a story starring my PC of first campaign I played in and it is a part of her backstory (Yes, I am my DM’s favourite player).
      > Most of the worldbuilding and all of the phrases in elven and dragon languages, characters and plots are my own creations, but there could be some obvious inspirations as a consequence of initial concepts having roots in a TTRPG system.

